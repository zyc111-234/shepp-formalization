name: Verify Lean proof

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          use-mathlib-cache: false

      - name: Verify single-file formalization
        shell: pwsh
        working-directory: formal
        run: ./verify.ps1
